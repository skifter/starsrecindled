doctrine:
  dbal:
    # These tables are managed by explicit DBAL migrations and must not be removed by ORM schema validation.
    schema_filter: '~^(?!(?:stars_account(?:$|_)|stars_game_invitation$)).*$~'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Bellcom\StarsTurnBundle\Service\AccountAccessService: ~
  Bellcom\StarsTurnBundle\Service\AccountCredentialVault: ~
  Bellcom\StarsTurnBundle\Service\GameInvitationService: ~

  Bellcom\StarsTurnBundle\Command\ReconcileGameInvitationsCommand: ~
  Bellcom\StarsTurnBundle\EventSubscriber\GameInvitationConsoleSubscriber: ~

  Bellcom\StarsTurnBundle\Controller\AccountController:
    public: true
    tags: ['controller.service_arguments']

  Bellcom\StarsTurnBundle\Controller\AccountGameProxyController:
    public: true
    tags: ['controller.service_arguments']
